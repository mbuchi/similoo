<head>

    <meta property="og:description" content="Find comparable buildings and check their metrics." data-i18n-attr="content:meta.og_description" />

    <meta property="og:image:width" content="1427" />
    <meta property="og:image:height" content="1152" />
    <meta property="og:image:alt" content="similoo - comparable buildings explorer" data-i18n-attr="content:meta.og_image_alt" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="similoo - comparable buildings explorer" data-i18n-attr="content:meta.twitter_title" />
    <meta name="twitter:description" content="Find comparable buildings and check their metrics." data-i18n-attr="content:meta.twitter_description" />
    <meta name="twitter:image" content="https://hub.aireon.ch/meta/similoo.jpg" />
    <meta name="twitter:image:alt" content="similoo - comparable buildings explorer" data-i18n-attr="content:meta.twitter_image_alt" />
    <link rel="icon" type="image/svg+xml" href="https://hub.aireon.ch/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <script>
        // similoo's theme ADJUSTMENT, layered on top of the shared pre-paint theme
        // bootstrap that aireonHtmlPlugin injects right after <meta charset> (see
        // vite.config.ts). Do NOT write that script's element id anywhere in this
        // file, comments included: the plugin uses the id as its "already
        // transformed" marker and skips the whole injection when it finds it.
        //
        // similoo used to carry a full second bootstrap here. Two bootstraps
        // racing over the same <html> is how you ship a flash, so the shared one
        // now owns the entire resolution order
        // (?theme= -> aireon_theme cookie -> localStorage `theme` -> OS dark ->
        // 'light') and stamps `.dark` + data-theme + color-scheme + background.
        // `.dark` matters here because @aireon/shared/glass.css keys its dark
        // Liquid Glass variants on `.dark[data-glass]`; similoo's own CSS and the
        // imperative engine key on [data-theme="dark"].
        //
        // The one thing the shared bootstrap cannot know about is `similoo-theme`,
        // the pre-suite per-app localStorage key that App.tsx still mirrors.
        // Keep in lockstep with initTheme('light') in src/main.tsx.
        (function () {
            var html = document.documentElement;
            var isTheme = function (v) { return v === 'light' || v === 'dark'; };

            // Re-stamp everything the shared bootstrap stamps. Doing less would
            // leave data-theme disagreeing with the `.dark` class, and
            // resolveThemePreference() reads data-theme back. Colors mirror
            // SHELL_PALETTE in @aireon/shared.
            var stamp = function (theme) {
                html.classList.toggle('dark', theme === 'dark');
                html.setAttribute('data-theme', theme);
                try {
                    html.style.colorScheme = theme;
                    html.style.backgroundColor = theme === 'dark' ? '#0f172a' : '#f8fafc';
                } catch (e) { /* no inline style */ }
            };

            var params = null;
            try {
                params = new URLSearchParams(window.location.search);
            } catch (e) { /* no URLSearchParams — the shared stamp still stands */ }

            var stamped = html.getAttribute('data-theme');
            var theme = isTheme(stamped) ? stamped : 'light';

            // One-time adoption of the pre-suite per-app key, so nobody loses the
            // theme they picked here before similoo joined the shared store. It
            // only applies when no explicit choice exists anywhere, which is
            // exactly when the shared bootstrap fell through to the OS preference
            // or the default. Writing `theme` is what makes initTheme() resolve
            // the same value once the bundle loads.
            try {
                var explicit =
                    (params && isTheme(params.get('theme'))) ||
                    /(?:^|; )aireon_theme=(dark|light)/.test(document.cookie) ||
                    isTheme(localStorage.getItem('theme'));
                if (!explicit) {
                    var legacy = localStorage.getItem('similoo-theme');
                    if (isTheme(legacy)) {
                        localStorage.setItem('theme', legacy);
                        theme = legacy;
                    }
                }
            } catch (e) { /* cookies or storage blocked */ }

            if (theme !== stamped) stamp(theme);
        })();
        // Inline pre-paint locale bootstrap. Sets <html lang> from persisted
        // choice (or navigator) before first paint.
        (function () {
            var supported = ['en', 'fr', 'de', 'it'];
            try {
                // `?lang=de` (URL_PARAMS_STANDARD.md) is an ephemeral override —
                // wins over the stored locale, never written anywhere here.
                var qLang = new URLSearchParams(window.location.search).get('lang');
                if (qLang && supported.indexOf(qLang) !== -1) {
                    document.documentElement.lang = qLang;
                    return;
                }
                var stored = localStorage.getItem('similoo:locale');
                if (stored && supported.indexOf(stored) !== -1) {
                    document.documentElement.lang = stored;
                    return;
                }
                var nav = (navigator.language || '').slice(0, 2).toLowerCase();
                if (supported.indexOf(nav) !== -1) {
                    document.documentElement.lang = nav;
                    return;
                }
            } catch (e) {
                /* ignore */
            }
            document.documentElement.lang = 'en';
        })();
    </script>
<script defer src="https://unpkg.com/lucide@0.358.0"></script>
    <link rel="canonical" href="https://similoo.aireon.ch/" />
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "publisher": { "@type": "Organization", "name": "Aireon", "url": "https://hub.aireon.ch/" }
    }
    </script>
</head>
<body>
<!-- React mounts the navbar / landing / comparison shell here, then a useEffect
     boots the preserved imperative engine (src/js/main.js) against it. The shell
     renders the same ids/classes the vanilla index.html used so the engine and
     bespoke CSS attach unchanged. -->
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
